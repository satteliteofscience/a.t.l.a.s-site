name: A.T.L.A.S. support and tester smoke tests
on:
  push:
    paths:
      - 'index.html'
      - 'tools/check_release_ready.cjs'
      - 'data/changelog.json'
      - 'GITHUB-ABOUT.md'
      - 'README.md'
      - 'changelog.js'
      - 'faq.js'
      - 'i18n.js'
      - 'calibration.js'
      - 'battery-cal-core.js'
      - 'param-tree.js'
      - 'tools/mavlink-bridge.cjs'
      - 'tools/check_release_configurator.cjs'
      - 'mavlink.js'
      - 'servo-config-core.js'
      - 'configurator.css'
      - 'tools/check_servo_config.cjs'
      - 'tools/check_configurator_ui.cjs'
      - 'quick-setup-core.js'
      - 'quick-setup.js'
      - 'tools/check_quick_setup.cjs'
      - 'tools/check_quick_setup_ui.cjs'
      - 'support.js'
      - 'support.css'
      - 'styles.css'
      - 'tools/check_performance.cjs'
      - 'contact-support.css'
      - 'contact-support.js'
      - 'tools/check_support_contact.cjs'
      - 'data/support.json'
      - 'data/subscriptions.json'
      - 'privacy.html'
      - 'configurator.html'
      - 'faq.html'
      - 'changelog.html'
      - 'page-meta.js'
      - 'app.js'
      - 'configurator.js'
      - 'dfu-ui.js'
      - 'firmware-access.js'
      - 'firmware-access.css'
      - 'data/firmware-access.json'
      - 'data/releases.json'
      - 'data/firmware-history.json'
      - 'Firmware/Matek Wing H743-V3/manifest.json'
      - 'Firmware/Matek Wing H743-V3/**/*.hex'
      - '.github/workflows/firmware-manifest.yml'
      - 'tools/release_manager.py'
      - 'tools/update_firmware_manifest.py'
      - 'tools/publish_github_releases.py'
      - 'RELEASE-DEPLOYMENT.md'
      - 'firmware-gateway/**'
      - 'tools/check_firmware_access.cjs'
      - 'firmware-gateway-check.html'
      - 'firmware-gateway-check.js'
      - 'tools/check_firmware_gateway_diagnostic.cjs'
      - 'assets/github-social-preview.jpg'
      - 'tools/check_social_preview.cjs'
      - 'tools/check_monobank_support.cjs'
      - '.github/workflows/website-support-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check support.js && node --check page-meta.js && node --check app.js && node --check contact-support.js && node --check configurator.js && node --check mavlink.js && node --check battery-cal-core.js && node --check tools/mavlink-bridge.cjs && node --check servo-config-core.js && node --check quick-setup-core.js && node --check quick-setup.js && node --check calibration.js && node --check i18n.js && node --check faq.js && node --check changelog.js && node --check dfu-ui.js && node --check firmware-access.js && node --input-type=module --check < firmware-gateway/src/index.js && node --check tools/check_monobank_support.cjs && node --check tools/check_social_preview.cjs && node --check tools/check_firmware_access.cjs
      - name: Verify monobank/Tally URLs, labels, privacy, no legacy form
        run: node tools/check_monobank_support.cjs
      - name: Verify link preview Open Graph and Twitter metadata
        run: node tools/check_social_preview.cjs
      - name: Verify production private firmware metadata, PIN routes and fail-closed publishers
        run: node tools/check_firmware_access.cjs
      - name: Verify firmware notice cleanup and support contact modal
        run: node tools/check_support_contact.cjs
      - name: Check render performance and animation scheduling
        run: node tools/check_performance.cjs
      - name: Verify automatic parameter loading and Release 1.0 status
        run: node tools/check_release_ready.cjs
      - name: Verify release configurator imports, voltage calibration and local UDP bridge
        run: node tools/check_release_configurator.cjs
      - name: Verify servo reverse persistence and serialized writes
        run: node tools/check_servo_config.cjs
      - name: Verify configurator apply transition, support anchor and post-flash note
        run: node tools/check_configurator_ui.cjs
      - name: Verify Quick Setup protocol, parameter and safety gates
        run: node tools/check_quick_setup.cjs && node tools/check_quick_setup_ui.cjs
      - name: Verify old public release scripts cannot run
        run: |
          python3 -m py_compile tools/release_manager.py tools/update_firmware_manifest.py tools/publish_github_releases.py
          if python3 tools/release_manager.py --once; then echo "Unsafe public archiver accepted run"; exit 1; fi
          if python3 tools/update_firmware_manifest.py; then echo "Unsafe public manifest accepted run"; exit 1; fi
          if python3 tools/publish_github_releases.py --dry-run; then echo "Unsafe public GitHub publisher accepted run"; exit 1; fi
      - name: Unit-test server-side release PIN and per-tester keys
        run: node --test firmware-gateway/tests/*.test.js
      - name: Check temporary gateway diagnostics page
        run: node --check firmware-gateway-check.js && node tools/check_firmware_gateway_diagnostic.cjs
