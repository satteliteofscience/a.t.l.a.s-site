name: A.T.L.A.S. support and tester smoke tests
on:
  push:
    paths:
      - 'index.html'
      - 'support.js'
      - 'support.css'
      - 'data/support.json'
      - 'data/subscriptions.json'
      - 'privacy.html'
      - 'tools/check_monobank_support.cjs'
      - '.github/workflows/website-support-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check support.js && node --check tools/check_monobank_support.cjs
      - name: Verify monobank/Tally URLs, labels, privacy, no legacy form
        run: node tools/check_monobank_support.cjs
