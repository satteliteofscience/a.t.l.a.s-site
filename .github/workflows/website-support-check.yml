name: A.T.L.A.S. support and tester smoke tests
on:
  push:
    paths:
      - 'index.html'
      - 'support.js'
      - 'support.css'
      - 'data/support.json'
      - 'data/subscriptions.json'
      - 'privacy.html'
      - 'configurator.html'
      - 'faq.html'
      - 'changelog.html'
      - 'page-meta.js'
      - 'app.js'
      - 'configurator.js'
      - 'dfu-ui.js'
      - 'firmware-access.js'
      - 'firmware-access.css'
      - 'data/firmware-access.json'
      - 'firmware-gateway/**'
      - 'tools/check_firmware_access.cjs'
      - 'firmware-gateway-check.html'
      - 'firmware-gateway-check.js'
      - 'tools/check_firmware_gateway_diagnostic.cjs'
      - 'assets/github-social-preview.jpg'
      - 'tools/check_social_preview.cjs'
      - 'tools/check_monobank_support.cjs'
      - '.github/workflows/website-support-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check support.js && node --check page-meta.js && node --check app.js && node --check configurator.js && node --check dfu-ui.js && node --check firmware-access.js && node --input-type=module --check < firmware-gateway/src/index.js && node --check tools/check_monobank_support.cjs && node --check tools/check_social_preview.cjs && node --check tools/check_firmware_access.cjs
      - name: Verify monobank/Tally URLs, labels, privacy, no legacy form
        run: node tools/check_monobank_support.cjs
      - name: Verify link preview Open Graph and Twitter metadata
        run: node tools/check_social_preview.cjs
      - name: Verify staged private firmware access code and no hardcoded PINs
        run: node tools/check_firmware_access.cjs
      - name: Unit-test server-side release PIN and per-tester keys
        run: node --test firmware-gateway/tests/*.test.js
      - name: Check temporary gateway diagnostics page
        run: node --check firmware-gateway-check.js && node tools/check_firmware_gateway_diagnostic.cjs
