name: A.T.L.A.S. support and tester smoke tests
# Every push, pull request and manual run executes the whole suite: every tools/check_*.cjs, the syntax of every script,
# the gateway unit tests and the guards of the protected-firmware rules. New checks are picked up by their file name;
# there is no path filter to keep in sync.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Refuse accidentally published plaintext firmware files
        run: |
          if find Firmware/ -type f -iname '*.hex' | grep -q .; then
            echo "::error::Public HEX found. Private R2 publishing required."
            exit 1
          fi
      - name: Check JavaScript syntax of every script
        run: |
          failed=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::syntax error"; failed=1; }
          done < <(find js data tools -type f \( -name '*.js' -o -name '*.cjs' \) | sort)
          node --input-type=module --check < firmware-gateway/src/index.js || failed=1
          exit $failed
      - name: Run every regression check (tools/check_*.cjs)
        run: |
          failed=0
          for f in tools/check_*.cjs; do
            echo "::group::$f"
            node "$f" || { echo "::error file=$f::check failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
      - name: Unit-test server-side release PIN, per-tester keys and the public catalog
        run: node --test firmware-gateway/tests/*.test.js
      - name: Verify old public release scripts cannot run
        run: |
          python3 -m py_compile tools/release_manager.py tools/update_firmware_manifest.py tools/publish_github_releases.py
          if python3 tools/release_manager.py --once; then echo "Unsafe public archiver accepted run"; exit 1; fi
          if python3 tools/update_firmware_manifest.py; then echo "Unsafe public manifest accepted run"; exit 1; fi
          if python3 tools/publish_github_releases.py --dry-run; then echo "Unsafe public GitHub publisher accepted run"; exit 1; fi

  windows-connector-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate official Node portable binary SHA-256 reference
        shell: powershell
        run: |
          $manifest = (Invoke-WebRequest -UseBasicParsing -Uri 'https://nodejs.org/dist/v24.22.2/SHASUMS256.txt').Content
          $manifest -split "`n" | Where-Object { $_ -match 'win-(x64|arm64)/node.exe' } | ForEach-Object { Write-Host $_ }
      - name: Parse portable Windows TCP connector bootstrap with native PowerShell
        shell: powershell
        run: |
          $file = 'tools/A.T.L.A.S.-TCP-Connector.cmd'
          $source = [System.IO.File]::ReadAllText((Resolve-Path $file).Path,[System.Text.Encoding]::UTF8)
          $marker = ':: ATLAS_POWERSHELL_START'
          $pos = $source.LastIndexOf($marker,[System.StringComparison]::Ordinal)
          if($pos -lt 0) { throw 'Embedded PowerShell marker is missing' }
          $script = $source.Substring($pos+$marker.Length)
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($script,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'A.T.L.A.S. Windows launcher contains invalid PowerShell syntax'
          }
          Write-Host 'PASS: Native Windows PowerShell syntax of portable one-click TCP launcher'
      - name: Test real first-run portable Node download and connector integrity
        shell: powershell
        timeout-minutes: 6
        run: |
          $env:ATLAS_CONNECTOR_FORCE_PORTABLE='1'
          $env:ATLAS_CONNECTOR_SELFTEST='1'
          & cmd.exe /d /c 'tools\A.T.L.A.S.-TCP-Connector.cmd'
          if($LASTEXITCODE -ne 0) { throw ('Real Windows portable bootstrap failed: exit '+$LASTEXITCODE) }
          $expected = Join-Path $env:LOCALAPPDATA 'ATLAS-TCP-Connector\node-v24.22.2-win-x64.exe'
          if(-not (Test-Path -LiteralPath $expected)) { throw ('Verified Node binary not found at: '+$expected) }
          Write-Host 'PASS: Full launcher first run downloaded and verified portable Node.js and pinned bridge'
      - name: Parse the USB driver installer with native PowerShell
        shell: powershell
        run: |
          $file = 'tools/A.T.L.A.S.-USB-Drivers.cmd'
          $source = [System.IO.File]::ReadAllText((Resolve-Path $file).Path,[System.Text.Encoding]::UTF8)
          $marker = ':: ATLAS_POWERSHELL_START'
          $pos = $source.LastIndexOf($marker,[System.StringComparison]::Ordinal)
          if($pos -lt 0) { throw 'Embedded PowerShell marker is missing' }
          $script = $source.Substring($pos+$marker.Length)
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($script,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'The USB driver installer contains invalid PowerShell syntax'
          }
          Write-Host 'PASS: Native Windows PowerShell syntax of the USB driver installer'
      - name: Run the read-only USB check of the driver installer
        shell: powershell
        timeout-minutes: 4
        run: |
          $env:ATLAS_NOPAUSE='1'
          & cmd.exe /d /c 'tools\A.T.L.A.S.-USB-Drivers.cmd check'
          if($LASTEXITCODE -ne 0) { throw ('USB check failed: exit '+$LASTEXITCODE) }
          Write-Host 'PASS: the read-only check ran on a clean Windows runner'
