jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check js/site/support.js && node --check js/site/page-meta.js && node --check js/site/app.js && node --check js/site/contact-support.js && node --check js/configurator/configurator.js && node --check tools/check_dashboard_demo_arm.cjs && node --check js/configurator/mavlink.js && node --check js/configurator/mavlink-status-core.js && node --check js/configurator/ahrs-filter-core.js && node --check js/configurator/mavftp-param.js && node --check js/configurator/battery-cal-core.js && node --check js/configurator/tempcal-core.js && node --check js/configurator/tempcal-ui.js && node --check tools/mavlink-bridge.cjs && node --check js/configurator/servo-config-core.js && node --check js/configurator/quick-setup-core.js && node --check js/configurator/quick-setup.js && node --check js/configurator/calibration.js && node --check js/site/i18n.js && node --check js/site/faq.js && node --check js/site/changelog.js && node --check js/site/sitl-demo.js && node --check tools/check_sitl_demo.cjs &&node --check js/configurator/dfu-ui.js && node --check js/configurator/dfu-flasher.js && node --check tools/check_cube_plus_local_dfu.cjs && node --check tools/check_cube_plus_dfu.cjs && node --check tools/check_uni_mini_and_transport.cjs && node --check tools/check_uni_release_metadata.cjs && node --check tools/check_catalog_resilience.cjs && node --check js/site/firmware-access.js && node --input-type=module --check < firmware-gateway/src/index.js && node --check tools/check_monobank_support.cjs && node --check tools/check_social_preview.cjs && node --check tools/check_firmware_access.cjs
      - name: Verify monobank/Tally URLs, labels, privacy, no legacy form
        run: node tools/check_monobank_support.cjs
      - name: Verify link preview Open Graph and Twitter metadata
        run: node tools/check_social_preview.cjs
      - name: Verify production private firmware metadata, PIN routes and fail-closed publishers
        run: node tools/check_firmware_access.cjs
      - name: Verify Cube Orange Plus release metadata and DFU cross-board safety
        run: node tools/check_cube_plus_dfu.cjs
      - name: Check Cube Orange Plus local HEX DFU target isolation
        run: node tools/check_cube_plus_local_dfu.cjs
      - name: Verify Uni-IC743 Mini firmware selection and MAVLink CRC resynchronization
        run: node tools/check_uni_mini_and_transport.cjs
      - name: Verify staged private Uni-IC743 Mini release metadata
        run: node tools/check_uni_release_metadata.cjs
      - name: Verify homepage and PIN gateway recovery after temporary network errors
        run: node tools/check_catalog_resilience.cjs
      - name: Verify firmware notice cleanup and support contact modal
        run: node tools/check_support_contact.cjs
      - name: Check render performance and animation scheduling
        run: node tools/check_performance.cjs
      - name: Check language switching, source comparison and queued MAVLink writes
        run: node tools/check_site_11.cjs
      - name: Verify SITL replay pages for 6.3 kg and 7.2 kg models
        run: node tools/check_sitl_demo.cjs
      - name: Verify demo in-flight ARM status and live MAVLink safety isolation
        run: node tools/check_dashboard_demo_arm.cjs
      - name: Verify automatic parameter loading and Release 1.0 status
        run: node tools/check_release_ready.cjs
      - name: Verify complete MAVLink STATUSTEXT including INFO/DEBUG and performance monitor
        run: node tools/check_mavlink_status_text.cjs
      - name: Verify live AHRS/DCM estimator, TCP label and parameter cache navigation
        run: node tools/check_ahrs_nav_cache.cjs
      - name: Verify fast MAVFTP packed-parameter read and fallback
        run: node tools/check_mavftp_params.cjs
      - name: Verify MAVFTP BurstReadFile streaming, packet loss repair and safe fallback
        run: node tools/check_mavftp_burst.cjs
      - name: Verify release configurator imports, voltage calibration and local UDP bridge
        run: node tools/check_release_configurator.cjs
      - name: Verify first TCP parameter read does not interfere with ground-station telemetry
        run: node tools/check_tcp_startup_contention.cjs
      - name: Verify Windows one-click TCP connector and secure handoff
        run: node tools/check_one_click_tcp.cjs
      - name: Verify servo reverse persistence and serialized writes
        run: node tools/check_servo_config.cjs
      - name: Verify configurator apply transition, support anchor and post-flash note
        run: node tools/check_configurator_ui.cjs
      - name: Verify post-hardware MAVLink multi-vehicle and UI safety regressions
        run: node tools/check_post_hardware_audit.cjs
      - name: Verify INS temperature calibration modes, readback and diagnostic coefficients
        run: node tools/check_tempcal.cjs
      - name: Verify Quick Setup protocol, parameter and safety gates
        run: node tools/check_quick_setup.cjs && node tools/check_quick_setup_ui.cjs
      - name: Verify old public release scripts cannot run
        run: |
          python3 -m py_compile tools/release_manager.py tools/update_firmware_manifest.py tools/publish_github_releases.py
          if python3 tools/release_manager.py --once; then echo "Unsafe public archiver accepted run"; exit 1; fi
          if python3 tools/update_firmware_manifest.py; then echo "Unsafe public manifest accepted run"; exit 1; fi
          if python3 tools/publish_github_releases.py --dry-run; then echo "Unsafe public GitHub publisher accepted run"; exit 1; fi
      - name: Unit-test server-side release PIN and per-tester keys
        run: node --test firmware-gateway/tests/*.test.js
      - name: Check temporary gateway diagnostics page
        run: node --check js/site/firmware-gateway-check.js && node tools/check_firmware_gateway_diagnostic.cjs

  windows-connector-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate official Node portable binary SHA-256 reference
        shell: powershell
        run: |
          $manifest = (Invoke-WebRequest -UseBasicParsing -Uri 'https://nodejs.org/dist/v24.22.2/SHASUMS256.txt').Content
          $manifest -split "`n" | Where-Object { $_ -match 'win-(x64|arm64)/node.exe' } | ForEach-Object { Write-Host $_ }
      - name: Parse portable Windows TCP connector bootstrap with native PowerShell
        shell: powershell
        run: |
          $file = 'tools/A.T.L.A.S.-TCP-Connector.cmd'
          $source = [System.IO.File]::ReadAllText((Resolve-Path $file).Path,[System.Text.Encoding]::UTF8)
          $marker = ':: ATLAS_POWERSHELL_START'
          $pos = $source.LastIndexOf($marker,[System.StringComparison]::Ordinal)
          if($pos -lt 0) { throw 'Embedded PowerShell marker is missing' }
          $script = $source.Substring($pos+$marker.Length)
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($script,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'A.T.L.A.S. Windows launcher contains invalid PowerShell syntax'
          }
          Write-Host 'PASS: Native Windows PowerShell syntax of portable one-click TCP launcher'
      - name: Test real first-run portable Node download and connector integrity
        shell: powershell
        timeout-minutes: 6
        run: |
          $env:ATLAS_CONNECTOR_FORCE_PORTABLE='1'
          $env:ATLAS_CONNECTOR_SELFTEST='1'
          & cmd.exe /d /c 'tools\A.T.L.A.S.-TCP-Connector.cmd'
          if($LASTEXITCODE -ne 0) { throw ('Real Windows portable bootstrap failed: exit '+$LASTEXITCODE) }
          $expected = Join-Path $env:LOCALAPPDATA 'ATLAS-TCP-Connector\node-v24.22.2-win-x64.exe'
          if(-not (Test-Path -LiteralPath $expected)) { throw ('Verified Node binary not found at: '+$expected) }
          Write-Host 'PASS: Full launcher first run downloaded and verified portable Node.js and pinned bridge'
