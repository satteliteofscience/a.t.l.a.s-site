name: A.T.L.A.S. protected firmware distribution — public publish disabled
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-private-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse accidentally published plaintext firmware files
        run: |
          if find Firmware/ -type f -iname '*.hex' | grep -q .; then
            echo "::error::Public HEX found. Private R2 publishing required."
            exit 1
          fi
          node tools/check_firmware_access.cjs
          echo "Old public archive workflow is intentionally disabled."
          echo "Upload new firmware privately to R2, update signed-off catalog/manifest and matching GPL source."
