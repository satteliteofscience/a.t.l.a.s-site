# Example only; use your own domain and TLS certificate in production.
server {
    listen 80;
    server_name atlas.example.invalid;
    root /srv/atlas-public;
    index index.html;
    autoindex off;
    # Put TLS termination in your real nginx site config.
    location ~ ^/(\.git|\.github|Firmware/incoming/|tools/|deploy/|data/firmware-history\.json) { return 404; }
    location ~ \.(?:json)$ { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location / { try_files $uri $uri/ =404; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
