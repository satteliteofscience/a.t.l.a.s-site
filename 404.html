</style></head><body><main><h1>404</h1><p id="text"></p><a id="home" href="/">A.T.L.A.S.</a></main><script>
(()=>{'use strict';
const words={ru:['Страница не найдена. Возможно, адрес изменился или страница была перенесена.','На главную'],uk:['Сторінку не знайдено. Можливо, адреса змінилася або сторінку було перенесено.','На головну'],en:['Page not found. The address may have changed or the page may have moved.','Back to the homepage']};
let lang='ru';try{lang=localStorage.getItem('atlas-language')||'ru';}catch{}if(!words[lang])lang='ru';
document.documentElement.lang=lang;document.getElementById('text').textContent=words[lang][0];
const home=document.getElementById('home');home.textContent=words[lang][1];
// Project pages are served from /<repository>/; custom domains from /.
const parts=location.pathname.split('/').filter(Boolean);home.href=/\.github\.io$/.test(location.hostname)&&parts.length?'/'+parts[0]+'/':'/';
})();
