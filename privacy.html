const d={"ru":["Конфиденциальность и заявки на тестирование","A.T.L.A.S. — независимый проект. Здесь объясняется обработка данных заявителей Early Tester Program и добровольная поддержка через monobank.","Какие данные собираются","После добровольной отправки формы Tally обрабатываются: email, модель полётного контроллера, GitHub-ник (если указан), опыт ArduPlane, необязательная отметка о пожертвовании, согласия и дата заявки. Ответы передаются в приватную Google Sheets-таблицу владельца проекта. Сам GitHub Pages не собирает и не сохраняет заявки.","Согласие и отмена","Для отправки заявки требуется отдельное согласие на обработку данных и связь по тестированию. Согласие на будущую новостную рассылку необязательно и не даёт автоматической подписки. Владение email перед приглашением проверяется вручную. Для запроса доступа или удаления данных необходим опубликованный контакт оператора проекта.","Рассылка прошивок","Заявки рассматривает разработчик вручную. Отбор, email-проверка и доступ к закрытым тестовым прошивкам не автоматизированы. Подтверждённые участники могут получить отдельное приглашение; пожертвование не гарантирует допуска. Автоматическая отправка писем через Tally сейчас не настроена.","Пожертвования","Поддержка проекта добровольна и не связана с подпиской. Пожертвование открывается по публичной ссылке monobank Банки. Сумма и доступные способы оплаты выбираются на стороне monobank. Сайт A.T.L.A.S. не обрабатывает банковские карты и не подтверждает зачисление переводов. Старый IBAN на сайте скрыт.","Контакты и запуск","Оператору проекта необходимо указать публичный контакт для обращений о персональных данных, правила удаления и сроки хранения. Перед массовым сбором заявок следует дополнить эту страницу действительными реквизитами обратной связи.","Регистрация обрабатывается через Tally и приватную Google Sheets. Пожертвования необязательны. Контакт для запросов об удалении данных ещё требуется указать."],"uk":["Конфіденційність і заявки на тестування","A.T.L.A.S. — незалежний проєкт. Тут пояснено обробку даних заявників Early Tester Program і добровільну підтримку через monobank.","Які дані збираються","Після добровільного надсилання форми Tally обробляються: email, модель польотного контролера, нік GitHub (за бажанням), досвід ArduPlane, необов’язкова позначка про пожертву, згоди та дата заявки. Відповіді надходять у приватну Google Sheets-таблицю власника проєкту. Сам GitHub Pages не збирає і не зберігає заявки.","Згода та відписка","Для заявки потрібна окрема згода на обробку даних і зв’язок щодо тестування. Згода на майбутню новинну розсилку необов’язкова й не створює автоматичної підписки. Належність email перед запрошенням перевіряється вручну. Для запитів щодо доступу та видалення даних потрібен опублікований контакт оператора.","Розсилка прошивок","Заявки переглядає розробник вручну. Відбір, перевірка email і доступ до закритих тестових прошивок не автоматизовані. Схвалені учасники можуть отримати окреме запрошення; пожертва не гарантує допуску. Автоматична розсилка через Tally зараз не налаштована.","Пожертви","Підтримка проєкту добровільна та не пов’язана з підпискою. Поповнення відбувається за публічним посиланням monobank Банки. Сума та доступні способи оплати обираються безпосередньо в monobank. Сайт A.T.L.A.S. не обробляє дані банківських карток і не підтверджує надходження переказу. Старий IBAN приховано.","Контакти та запуск","Оператор проєкту має вказати публічний контакт для запитів щодо персональних даних, правила видалення та строки зберігання. Перед масовим збиранням заявок потрібно доповнити цю сторінку контактними даними.","Реєстрація обробляється через Tally та приватну Google Sheets. Пожертви добровільні. Контакт для запитів про видалення даних ще потрібно додати."],"en":["Privacy and early tester applications","A.T.L.A.S. is an independent project. This notice describes Early Tester applications and voluntary support through monobank.","Information collected","When an applicant submits the Tally form, Tally processes their email, flight-controller choice, optional GitHub username and ArduPlane experience, optional donation declaration, consents and submission date. Responses are transferred to the project owner's private Google Sheet. The public GitHub Pages website does not collect or store applications.","Consent and unsubscribe","Submitting an application requires separate consent to data processing and contact about testing. Consent to future newsletters is optional and does not automatically subscribe the applicant. Email ownership is checked manually before an invitation. A published operator contact is needed for access or deletion requests.","Firmware mailing","Applications are reviewed manually. Selection, email verification and access to private test firmware are not automated. Approved testers may receive separate invitations; donations do not guarantee approval. Tally is not currently configured to send automated release mail.","Donations","Project support is voluntary and independent from newsletter subscriptions. A public monobank Jar link takes visitors to monobank, where they choose the amount and available payment options. A.T.L.A.S. does not process card details or verify incoming transfers. The previous IBAN is hidden.","Contact and activation","The project operator must publish a contact for personal-data requests and document deletion and retention procedures. Before promoting the registration broadly, add real contact information to this notice.","Applications use Tally and a private Google Sheet. Donations are optional. A contact for data deletion requests still needs to be published."]};
function show(lang){const vals=d[lang]||d.ru,keys=['privacyTitle','privacyIntro','privacyDataTitle','privacyData','privacyConsentTitle','privacyConsent','privacyMailTitle','privacyMail','privacyPaymentTitle','privacyPayment','privacyContactTitle','privacyContact','privacyFooter'];keys.forEach((k,i)=>document.getElementById(k).textContent=vals[i]);document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.lang);try{localStorage.setItem('atlas-language',b.dataset.lang)}catch{}}));let initial='ru';try{initial=localStorage.getItem('atlas-language')||'ru'}catch{}show(initial);
</script></body></html>
