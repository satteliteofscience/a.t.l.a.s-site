<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A.T.L.A.S. — Privacy / Конфиденциальность</title><meta name="theme-color" content="#0b140b"><style>
:root{color-scheme:dark}body{margin:0;background:linear-gradient(130deg,#091009,#152213);color:#e8e1af;font:16px/1.75 system-ui,sans-serif}main{max-width:920px;margin:0 auto;padding:34px 22px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}a{color:#e7cf7a}.lang button{background:#182716;color:#e8e1af;border:1px solid #697c45;padding:10px 14px;cursor:pointer;margin-left:4px}.lang button.active{background:#657d37}section{background:#122010;border:1px solid #697b42;padding:25px;margin-top:25px;border-radius:4px}h1{color:#e7d173;line-height:1.2}h2{color:#e5d49c}li{margin:12px 0}.muted{color:#a8b390}</style></head><body><main><header><a href="index.html#support">← A.T.L.A.S. Control Center</a><div class="lang"><button type="button" data-lang="ru" class="active">RU</button><button type="button" data-lang="uk">UA</button><button type="button" data-lang="en">ENG</button></div></header><section><h1 id="privacyTitle"></h1><p id="privacyIntro"></p><h2 id="privacyDataTitle"></h2><p id="privacyData"></p><h2 id="privacyConsentTitle"></h2><p id="privacyConsent"></p><h2 id="privacyMailTitle"></h2><p id="privacyMail"></p><h2 id="privacyPaymentTitle"></h2><p id="privacyPayment"></p><h2 id="privacyContactTitle"></h2><p id="privacyContact"></p></section><p class="muted" id="privacyFooter"></p></main><script>
const d={ru:['Конфиденциальность и подписки','A.T.L.A.S. — независимый проект. Эта страница объясняет, какие данные используются для новостей и рассылки прошивок.','Какие данные собираются','После добровольной отправки формы и подтверждения email: электронный адрес, выбранный полётный контроллер, язык, предпочтение ранних испытаний и время согласия. Эти данные хранятся на отдельном защищённом сервере, не в публичном репозитории.','Согласие и отмена','Подписка требует явного согласия и подтверждения по письму. Каждое уведомление содержит ссылку отписки. По запросу подписчик может обратиться к оператору для удаления данных.','Рассылка прошивок','Рассылка отправляется только подписчикам с подтверждённой почтой и подходящим типом контроллера. Тестовые сборки отправляются только после отдельного одобрения. Неподтверждённые адреса не получают релизов.','Донаты','IBAN используется только для добровольных банковских переводов. Сайт не обрабатывает банковские карты и не подтверждает автоматически факт пожертвования. Перевести средства можно без подписки.','Контакты и запуск','До запуска приёма заявок разработчик должен указать публичный адрес связи для вопросов и запросов на удаление данных, настроить почтовый сервер и опубликовать сведения об операторе данных. Пока адрес связи и сервер не указаны, форма рассылки отключена.','Перед публичным включением рассылки требуется завершить настройку сервера и контактной информации.'],uk:['Конфіденційність і підписки','A.T.L.A.S. — незалежний проєкт. Ця сторінка пояснює використання даних для новин і надсилання прошивок.','Які дані збираються','Після добровільного надсилання форми та підтвердження email: адреса, обраний польотний контролер, мова, бажання брати участь у ранніх тестах і час згоди. Ці дані зберігаються на окремому захищеному сервері, а не в публічному репозиторії.','Згода та відписка','Підписка потребує явної згоди та підтвердження електронною поштою. Кожний лист містить посилання для відписки. За запитом підписник може звернутися до оператора з проханням видалити дані.','Розсилка прошивок','Листи отримують лише підписники з підтвердженою поштою та відповідним типом контролера. Тестові збірки надсилають лише після окремого схвалення. Непідтверджені адреси не отримують випусків.','Пожертви','IBAN використовується лише для добровільних банківських переказів. Сайт не обробляє дані карток і не підтверджує автоматично отримання внесків. Переказ можливий без підписки.','Контакти та запуск','До початку приймання заявок розробник має додати публічний канал зв’язку для питань і запитів на видалення даних, налаштувати поштовий сервер і вказати оператора даних. Поки контакти й сервер не налаштовано, форма розсилки вимкнена.','Перед публічним запуском розсилки необхідно завершити налаштування сервера й контактної інформації.'],en:['Privacy and email subscriptions','A.T.L.A.S. is an independent project. This page explains how newsletter and firmware notification data is handled.','Information collected','After you voluntarily submit the form and confirm your address: email, selected flight controller, language, early-testing preference and consent time. This information is held on a separate private server, never in the public repository.','Consent and unsubscribe','Subscriptions require explicit consent and email confirmation. Every notification contains an unsubscribe link. Subscribers may request deletion from the operator.','Firmware mailing','Messages are sent only to confirmed subscribers with the selected compatible controller. Early-test builds are sent only to separately approved testers. Unconfirmed addresses receive no releases.','Donations','The public IBAN supports voluntary bank transfers only. The site never handles card details or automatically verifies payment. You can donate without joining the mailing list.','Contact and activation','Before collecting signups, the developer must provide a public contact for questions and deletion requests, configure the mail server, and identify the data operator. Until the server and contact are configured, signups are unavailable.','Before activating public mailing, complete server setup and operator contact information.']};
function show(lang){const vals=d[lang]||d.ru,keys=['privacyTitle','privacyIntro','privacyDataTitle','privacyData','privacyConsentTitle','privacyConsent','privacyMailTitle','privacyMail','privacyPaymentTitle','privacyPayment','privacyContactTitle','privacyContact','privacyFooter'];keys.forEach((k,i)=>document.getElementById(k).textContent=vals[i]);document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.lang);try{localStorage.setItem('atlas-language',b.dataset.lang)}catch{}}));let initial='ru';try{initial=localStorage.getItem('atlas-language')||'ru'}catch{}show(initial);
</script></body></html>
