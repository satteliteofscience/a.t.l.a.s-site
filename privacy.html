:root{color-scheme:dark}body{margin:0;background:linear-gradient(130deg,#091009,#152213);color:#e8e1af;font:16px/1.75 system-ui,sans-serif}main{max-width:920px;margin:0 auto;padding:34px 22px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}a{color:#e7cf7a}.lang button{background:#182716;color:#e8e1af;border:1px solid #697c45;padding:10px 14px;cursor:pointer;margin-left:4px}.lang button.active{background:#657d37}section{background:#122010;border:1px solid #697b42;padding:25px;margin-top:25px;border-radius:4px}h1{color:#e7d173;line-height:1.2}h2{color:#e5d49c}li{margin:12px 0}.muted{color:#a8b390}</style>  <meta name="atlas-page" content="privacy.html">

</head><body><main><header><a href="index.html#support">← A.T.L.A.S. Control Center</a><div class="lang"><button type="button" data-lang="ru" class="active">RU</button><button type="button" data-lang="uk">UA</button><button type="button" data-lang="en">ENG</button></div></header><section><h1 id="privacyTitle"></h1><p id="privacyIntro"></p><h2 id="privacyDataTitle"></h2><p id="privacyData"></p><h2 id="privacyConsentTitle"></h2><p id="privacyConsent"></p><h2 id="privacyMailTitle"></h2><p id="privacyMail"></p><h2 id="privacyPaymentTitle"></h2><p id="privacyPayment"></p><h2 id="privacyContactTitle"></h2><p id="privacyContact"></p></section><p class="muted" id="privacyFooter"></p></main><script>
const d={"ru":["Конфиденциальность и подписки","A.T.L.A.S. — независимый проект. Информация о добровольной подписке, обновлениях прошивок и пожертвованиях.","Какие данные собираются","При подписке на размещённой у Brevo форме могут запрашиваться email, полётный контроллер, язык, согласие на письма и желание участвовать в тестировании. Эти данные обрабатываются в Brevo, не записываются в GitHub Pages или публичный репозиторий. Выбор платы на сайте без открытия формы не отправляет личные данные.","Согласие и отмена","Письма отправляются только после явного согласия и подтверждения email через double opt-in Brevo. В каждом письме есть ссылка отписки. Запросы на доступ/удаление данных направляются оператору проекта; его контакт должен быть опубликован до запуска подписок.","Рассылка прошивок","Публичные обновления могут рассылаться подписчикам подтверждённого списка соответствующей платы; сообщения содержат ссылки на публичные релизы и исходный код. Ранние закрытые прошивки доступны только приглашённым участникам отдельного приватного репозитория GitHub, после решения разработчика.","Пожертвования","Донат доброволен и не связан с подпиской. Перевод по IBAN выполняется в банковском приложении; при включении LiqPay вы переходите на страницу платёжного провайдера, который самостоятельно обрабатывает платёжные данные. Сайт не получает номера банковских карт и не подтверждает оплату.","Контакты и запуск","До запуска форм разработчик обязан опубликовать информацию об операторе данных и контакт для запросов, настроить Brevo double opt-in, списки подписчиков, страницу отписки и актуальные уведомления о приватности. Пока ссылки Brevo не указаны, подписка на сайте не активна.","Подписка обрабатывается внешним сервисом Brevo только после настройки владельцем проекта."],"uk":["Конфіденційність і підписки","A.T.L.A.S. — незалежний проєкт. Інформація про добровільну підписку, оновлення прошивок і пожертви.","Які дані збираються","Під час підписки у формі Brevo можуть запитуватися email, польотний контролер, мова, згода на листи та інтерес до тестування. Дані обробляються в Brevo, а не зберігаються в GitHub Pages чи публічному репозиторії. Вибір плати на сайті без переходу до форми не надсилає персональних даних.","Згода та відписка","Розсилка потребує явної згоди й підтвердження email через double opt-in Brevo. Кожний лист містить посилання відписки. Запити щодо доступу чи видалення даних надсилають оператору проєкту; його контакт потрібно опублікувати до запуску.","Розсилка прошивок","Публічні оновлення можуть надсилатися підтвердженим підписникам списку сумісної плати з посиланням на випуск та вихідний код. Закриті ранні прошивки доступні лише запрошеним учасникам окремого приватного репозиторію GitHub після схвалення розробником.","Пожертви","Пожертва добровільна та не пов’язана з підпискою. IBAN-переказ відбувається у банківському застосунку. Якщо увімкнено LiqPay, ви переходите на сторінку платіжного провайдера, який обробляє платіжні дані. Сайт не отримує реквізитів картки та не підтверджує оплату.","Контакти та запуск","Перед запуском форм розробник має опублікувати відомості про оператора даних і контакти для запитів, налаштувати double opt-in Brevo, списки, відписку та актуальну політику приватності. Поки посилання на форми Brevo відсутні, підписку на сайті не активовано.","Підписка обробляється зовнішнім сервісом Brevo тільки після налаштування власником проєкту."],"en":["Privacy and email subscriptions","A.T.L.A.S. is an independent project. Information about voluntary newsletters, firmware updates and donations.","Information collected","A Brevo-hosted subscription form may collect an email, flight-controller type, language, newsletter consent and optional early-test interest. These details are processed by Brevo, not stored on GitHub Pages or in this public repository. Selecting a board on the website without opening the form does not send personal data.","Consent and unsubscribe","Newsletters require explicit consent and email verification via Brevo double opt-in. Every campaign includes an unsubscribe link. Requests for access or erasure must be directed to the project data operator; their contact details must be published before signup activation.","Firmware mailing","Public updates may be emailed to confirmed subscribers of the corresponding board list, linking to public releases and source code. Private early-test firmware is only accessible to approved invitees of a separate private GitHub repository.","Donations","Donations are voluntary and independent from subscriptions. IBAN transfers take place in your banking app; when LiqPay is enabled you will visit the payment provider, which processes payment details separately. The site never receives bank-card details or verifies donations.","Contact and activation","Before activating hosted forms, the developer must identify the data operator, publish a contact for privacy requests and configure Brevo double opt-in, verified lists, unsubscribes and accurate privacy notices. Signup remains inactive until hosted form URLs are provided.","Subscription data is handled by Brevo only after the project owner completes setup."]};
function show(lang){const vals=d[lang]||d.ru,keys=['privacyTitle','privacyIntro','privacyDataTitle','privacyData','privacyConsentTitle','privacyConsent','privacyMailTitle','privacyMail','privacyPaymentTitle','privacyPayment','privacyContactTitle','privacyContact','privacyFooter'];keys.forEach((k,i)=>document.getElementById(k).textContent=vals[i]);document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.lang);try{localStorage.setItem('atlas-language',b.dataset.lang)}catch{}}));let initial='ru';try{initial=localStorage.getItem('atlas-language')||'ru'}catch{}show(initial);
</script></body></html>
